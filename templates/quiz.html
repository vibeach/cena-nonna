{% extends "_base.html" %}
{% block content %}
<div class="card">
    <h1>Sei dei nostri? 🏖️</h1>
    <p class="intro">Ciao <strong>{{ name }}</strong>! Piccola verifica prima di svelarti tutto.</p>
    <form action="{{ url_for('verify') }}" method="post">
        <h2>Qual è il soprannome di Ale?</h2>
        <div class="choices">
            {% for opt in options %}
            <label class="choice">
                <input type="radio" name="nickname" value="{{ opt }}" required>
                <span>{{ opt }}</span>
            </label>
            {% endfor %}
        </div>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <button type="submit">Verifica 🌴</button>
    </form>
</div>
<script>
document.querySelectorAll('.choice input').forEach(el => {
    el.addEventListener('change', () => {
        document.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
        el.closest('.choice').classList.add('selected');
    });
});
</script>
{% endblock %}
